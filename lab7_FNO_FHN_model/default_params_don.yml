#### Dataset parameters
dataset_train: "dataset/datasetFHN_train_v.mat"
dataset_test: "dataset/datasetFHN_test_v.mat"
arc: "DON"
full_v_data: False
batch_size: 100

#### Architecture parameters
adapt_actfun: True
scheduler: "reduceonplateau"
Loss: "L2"
epochs: 10000
lr: 0.001
u_dim: 3
x_dim: 1
G_dim: 100
inner_layer_b: [100, 100, 100]
inner_layer_t: [100, 100, 100]
activation_b: "Tanh"
activation_t: "Tanh"
arc_b: "FNN_LN"
arc_t: "FNN_LN"
initial_b: "Glorot normal"
initial_t: "Glorot normal"

#### Plotting and tensorboard
show_every: 5
