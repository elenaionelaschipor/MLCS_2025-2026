#### best of hyperparameters for FNO
#### Dataset parameters
arc: "FNO"
dataset_train: "dataset/datasetFHN_train_w.mat"
dataset_test: "dataset/datasetFHN_test_w.mat"
full_v_data: True
batch_size: 100
#### Architecture parameters
scaling: "None" # Default, Gaussian, Mixed or Fourier
scheduler: "reduceonplateau"
Loss: "L2" # mse or L2
epochs: 20
lr: # recover optimal learning rate from paper
#### FNO parameters
d_a: 2
d_v: 32
d_u: 1
L: 3
modes: # recover paper optimal architecture
act_fun: "ReLu"
initialization: "Kaiming"
arc_fno: "Zongyi"
x_padding: 10
#### Plotting and tensorboard
show_every: 1